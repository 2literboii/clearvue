    }
    header h1 { font-size: 2.5rem; margin-bottom: 10px; }
    header p { font-size: 1.1rem; opacity: 0.9; }
    .card {

    label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
    input, select { 
      width: 100%; 
      padding: 12px; 
      border: 2px solid #ddd; 
      border-radius: 6px; 
      font-size: 16px; 
      transition: border-color 0.3s;
    }
    input:focus, select:focus { outline: none; border-color: #1a3a5f; }
    button { 
      background: #1a3a5f; 
      color: white; 
      padding: 15px 30px; 
      border: none; 
      border-radius: 6px; 
      font-size: 18px; 
      font-weight: 600; 
      cursor: pointer; 
      width: 100%;
      transition: background 0.3s;
    }
    button:hover { background: #2c5282; }
    button:disabled { background: #999; cursor: not-allowed; }
    #status { 
      margin-top: 20px; 
      padding: 15px; 
      border-radius: 6px; 
      text-align: center; 
      font-weight: 600;
      display: none;
    }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
    .feature { text-align: center; padding: 20px; }
    .feature h3 { color: #1a3a5f; margin-bottom: 10px; }
    footer { text-align: center; padding: 30px 20px; color: #666; }
    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      header h1 { font-size: 2rem; }
    }
  </style>
</head>
